<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-label="Ilustração de Golfinho">
  <title>Golfinho</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#EAF7FE"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="dolphin" x1="0" y1="0" x2="0.9" y2="1">
      <stop stop-color="#8CD7F4"/>
      <stop offset=".55" stop-color="#55B6E3"/>
      <stop offset="1" stop-color="#3396C8"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#F5FDFF"/>
      <stop offset="1" stop-color="#D6F4FC"/>
    </linearGradient>
    <filter id="shadow" x="-35%" y="-35%" width="170%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#669BC1" flood-opacity=".22"/>
    </filter>
  </defs>
  <!-- Mesmo formato, fundo suave e legenda das demais cartas. -->
  <rect width="360" height="420" rx="24" fill="url(#bg)"/>
  <circle cx="59" cy="83" r="28" fill="#FFFFFFB9"/>
  <circle cx="301" cy="94" r="39" fill="#FFFFFFA5"/>
  <circle cx="284" cy="310" r="17" fill="#FFFFFFA0"/>
  <path d="M57 298 Q84 277 111 297 M238 296 Q261 285 284 294" fill="none" stroke="#A4DFF6" stroke-width="7" stroke-linecap="round"/>
  <g filter="url(#shadow)" stroke-linejoin="round" stroke-linecap="round">
    <!-- Flukes horizontais e pedúnculo caudal estreito (não é uma cauda de peixe). -->
    <path d="M111 259 C88 263 78 256 58 238 C62 259 67 271 82 280 C62 280 46 291 36 315 C58 307 83 302 116 284" fill="#4FA8D7" stroke="#367EAB" stroke-width="3.5"/>
    <!-- Corpo arqueado, como um golfinho saltando sobre a água. -->
    <path d="M86 277 C101 244 127 212 161 190 C198 163 225 150 248 155 C268 160 281 174 282 186 C283 198 276 214 262 230 C237 257 205 276 166 284 C132 291 108 284 86 277 Z" fill="url(#dolphin)" stroke="#FFFFFF" stroke-width="4"/>
    <!-- Nadadeira dorsal falcada, voltada para trás. -->
    <path d="M173 183 C191 161 206 137 209 112 C220 137 229 151 247 159 C223 160 198 169 183 191" fill="#4FA8D7" stroke="#357FAD" stroke-width="3"/>
    <!-- Ventre claro e contrastante. -->
    <path d="M91 278 C132 287 177 280 218 258 C244 244 263 224 278 199 C280 213 267 233 252 246 C222 274 189 290 157 291 C128 291 104 285 91 278 Z" fill="url(#belly)" opacity=".98"/>
    <!-- Nadadeira peitoral longa, abaixo do corpo. -->
    <path d="M199 250 C195 270 194 296 200 320 C215 306 228 279 232 254" fill="#3896C8" stroke="#2D7CA8" stroke-width="3.5"/>
    <!-- Melão da cabeça e focinho comprido, característico do golfinho-nariz-de-garrafa. -->
    <path d="M247 162 C264 158 279 166 286 178 C297 181 312 181 326 174 C324 187 309 197 288 198 C276 201 271 210 267 220 C262 200 256 178 247 162 Z" fill="#56B6E2" stroke="#4FA9DA" stroke-width="1.2"/>
    <!-- Linha sob o bico: separação clara da boca. -->
    <path d="M282 196 Q303 198 319 185" fill="none" stroke="#3484A9" stroke-width="3.6"/>
    <!-- Olho pequeno e orifício respiratório no alto da cabeça. -->
    <circle cx="267" cy="181" r="5.8" fill="#243B57"/>
    <circle cx="269" cy="179" r="1.8" fill="#FFFFFF"/>
    <path d="M243 160 Q249 157 255 160" fill="none" stroke="#327EAB" stroke-width="3.4"/>
    <path d="M147 223 Q168 202 193 190" fill="none" stroke="#C1F0FC" stroke-width="5" opacity=".5"/>
    <!-- Pequenas gotas de água destacam o salto. -->
    <path d="M76 213 Q64 203 58 212 M300 262 Q313 248 322 261" fill="none" stroke="#82CFF0" stroke-width="5" stroke-linecap="round"/>
    <circle cx="65" cy="224" r="4" fill="#83D3EF"/>
    <circle cx="307" cy="276" r="5" fill="#83D3EF"/>
  </g>
  <rect x="44" y="352" width="272" height="48" rx="24" fill="#FFFFFFE9"/>
  <text x="180" y="383" font-family="Verdana,Arial,sans-serif" font-weight="bold" font-size="23" text-anchor="middle" fill="#55516B">Golfinho</text>
</svg>
